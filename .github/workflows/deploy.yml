# Builds the web export and publishes it to GitHub Pages on every push to main.
#
# Expo's own guide publishes a `gh-pages` branch from your laptop via the
# gh-pages package. This does it on a runner instead, for two reasons: the
# 2.4 MB of build output never lands in the repo, and nobody has to remember
# to run a deploy script for the live site to match main.
name: Deploy website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and never cancel one midway: a half-uploaded artifact
# would take the site down rather than just delay the update.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # expo export has been seen to finish its work and then not exit. Without a
    # cap that hangs until the six-hour default, burning runner minutes on a
    # build that is already done.
    timeout-minutes: 20
    env:
      # Pages serves from /Edgewise, so the bundle must be built with that
      # prefix. app.config.js reads this; unset means root, which is what the
      # dev server and Vercel need.
      EXPO_WEB_BASE_URL: /Edgewise
      # These two are written in the open on purpose. Every EXPO_PUBLIC_ value
      # is compiled into the bundle in plain text, so the deployed site hands
      # both to anyone who opens it -- hiding them here would protect nothing
      # that publishing the site does not already expose. What protects the
      # data is per-user Row Level Security (scripts/secure-rls.sql, checked by
      # scripts/verify-rls.mjs), not secrecy of a publishable key.
      #
      # Keeping them here means a fresh clone deploys with no setup. A repo
      # secret of the same name overrides either one, which is the rotation
      # path if the project ever moves.
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL || 'https://nqwtetjrzoaggaerriew.supabase.co' }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY || 'sb_publishable_uDDjcFyVo4Fw3PsAGTXAMQ_zFGIOblV' }}
      # Optional, and there is no default: unset just means the Chat tab
      # explains itself instead of guessing at an endpoint.
      EXPO_PUBLIC_CLAUDE_PROXY_URL: ${{ secrets.EXPO_PUBLIC_CLAUDE_PROXY_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Guards against a future edit blanking the values above: a site whose
      # every sign-in dies against an undefined URL should fail here, loudly,
      # rather than deploy and look fine until someone tries to log in.
      - name: Check the Supabase config resolved
        run: |
          missing=
          [ -n "$EXPO_PUBLIC_SUPABASE_URL" ] || missing="$missing EXPO_PUBLIC_SUPABASE_URL"
          [ -n "$EXPO_PUBLIC_SUPABASE_ANON_KEY" ] || missing="$missing EXPO_PUBLIC_SUPABASE_ANON_KEY"
          if [ -n "$missing" ]; then
            echo "::error::No value for:$missing -- neither a repo secret nor the default in this workflow."
            exit 1
          fi
          echo "Supabase URL: $EXPO_PUBLIC_SUPABASE_URL"

      - run: npm ci

      # typecheck regenerates expo-env.d.ts first, via package.json's
      # pretypecheck hook. tsconfig includes that file, but Expo generates
      # it and it is gitignored, so a fresh checkout does not have it --
      # and without it tsc loses Expo's ambient types and every Node
      # import in the tests. It is why runs 1-4 failed here.
      - run: npm run typecheck
      - run: npm test -- --ci
      - run: npx expo export --platform web

      # enablement turns Pages on the first time this runs, so the site does
      # not need a click in Settings before it can go live.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
